# Image geometry defaults for Raspberry Pi 400.
# The image is intentionally smaller than the destination SD card. A one-time
# first-boot service will expand partition 2 and its ext4 filesystem.

IMAGE_SIZE_MIB=8192
BOOT_SIZE_MIB=1024
BOOT_FILESYSTEM=vfat
ROOT_FILESYSTEM=ext4
PARTITION_TABLE=dos
EXPAND_ROOT_ON_FIRST_BOOT=yes
BOOT_LABEL=MYLASTBOOT
ROOT_LABEL=MYLASTROOT
