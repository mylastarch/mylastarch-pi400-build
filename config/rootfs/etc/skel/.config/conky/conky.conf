conky.config = {
    output_backend = 'x11',
    update_interval = 2,
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    alignment = 'top_right',
    gap_x = 24,
    gap_y = 48,
    minimum_width = 250,
    default_color = 'white',
};

conky.text = [[
${color lightblue}RASPBERRY PI 400${color}
Uptime: $uptime
${hr}
${color lightblue}CPU${color}  $cpu%
${cpubar 8}
Temp: ${execi 5 awk '{printf "%.1f°C", $1/1000}' /sys/class/thermal/thermal_zone0/temp}
${hr}
${color lightblue}MEMORY${color}  $mem / $memmax  ($memperc%)
${membar 8}
${hr}
${color lightblue}ROOT DISK${color}  ${fs_used /} / ${fs_size /}
${fs_bar 8 /}
${hr}
${color lightblue}NETWORK (${addr wlan0})${color}
Download: ${downspeedf wlan0} KiB/s
Upload:   ${upspeedf wlan0} KiB/s
Zram (size / used): ${execi 5 sh -c "swapon --show=SIZE,USED --noheadings | head -n1"}
]];
